[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200

[rpc_endpoints]
bsc_testnet = "${BSC_TESTNET_RPC}"
bsc_testnet_dataseed = "https://bsc-testnet-dataseed.bnbchain.org"
bsc_testnet_official = "https://bsc-testnet.bnbchain.org"
bsc_testnet_prebsc = "https://bsc-prebsc-dataseed.bnbchain.org"
bsc_testnet_public = "https://bsc-testnet-rpc.publicnode.com"

bsc_mainnet = "https://bsc-dataseed.bnbchain.org"
bsc_mainnet_public = "https://bsc-dataseed-public.bnbchain.org"
bsc_mainnet_nariox = "https://bsc-dataseed.nariox.org"
bsc_mainnet_defibit = "https://bsc-dataseed.defibit.io"
bsc_mainnet_nodereal = "https://bsc.nodereal.io"

[etherscan]
bsc_testnet = { key = "${BSCSCAN_API_KEY}", url = "https://api-testnet.bscscan.com/api" }
bsc_mainnet = { key = "${BSCSCAN_API_KEY}", url = "https://api.bscscan.com/api" }
# 

